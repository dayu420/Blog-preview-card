<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link
      rel="preload"
      href="./assets/fonts/static/Figtree-ExtraBold.ttf"
      as="font"
      type="font/woff2"
    />
    <link
      rel="preload"
      href="./assets/fonts/static/Figtree-SemiBold.ttf"
      as="font"
      type="font/woff2"
    />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <div class="wrapper">
      <main class="blog-main">
        <div class="blog-preview-card">
          <img
            class="blog-card-illustration"
            src="./assets/images/illustration-article.svg"
            alt=""
          />
          <div class="blog-card-tag">Learning</div>
          <div class="blog-card-publish-date">Published 21 Dec 2023</div>
          <h2 class="blog-card-title">HTML & CSS foundations</h2>
          <p class="blog-card-snippet">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
          <div class="blog-card-footer">
            <img
              class="blog-card-author-avatar"
              src="./assets/images/image-avatar.webp"
              alt=""
            />
            <p class="blog-card-author">Greg Hooper</p>
          </div>
        </div>
      </main>
      <footer class="page-footer">
        <div class="attribution">
          Challenge by
          <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
            >Frontend Mentor</a
          >. Coded by <a href="#">DK</a>.
        </div>
      </footer>
    </div>
  </body>
</html>
